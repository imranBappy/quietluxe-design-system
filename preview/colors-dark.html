<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dark mode</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-frame" style="background:#0E0E0C;color:#F4F3EE;">
  <div class="tag" style="margin-bottom:14px;color:#A8A8A0;">Neutrals · Dark</div>
  <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;">
    <div class="col">
      <div class="swatch" style="background:#0E0E0C;border-color:#2A2A26;"></div>
      <div class="token-name" style="color:#F4F3EE;">--bg</div>
      <div class="token-meta">#0E0E0C</div>
    </div>
    <div class="col">
      <div class="swatch" style="background:#1A1A18;border-color:#2A2A26;"></div>
      <div class="token-name" style="color:#F4F3EE;">--surface</div>
      <div class="token-meta">#1A1A18</div>
    </div>
    <div class="col">
      <div class="swatch" style="background:#232320;border-color:#2A2A26;"></div>
      <div class="token-name" style="color:#F4F3EE;">--surface-elevated</div>
      <div class="token-meta">#232320</div>
    </div>
    <div class="col">
      <div class="swatch" style="background:#2A2A26;border-color:#3A3A35;"></div>
      <div class="token-name" style="color:#F4F3EE;">--border</div>
      <div class="token-meta">#2A2A26</div>
    </div>
    <div class="col">
      <div class="swatch" style="background:#A8A8A0;border-color:#2A2A26;"></div>
      <div class="token-name" style="color:#F4F3EE;">--fg-muted</div>
      <div class="token-meta">#A8A8A0</div>
    </div>
    <div class="col">
      <div class="swatch" style="background:#F4F3EE;border-color:#2A2A26;"></div>
      <div class="token-name" style="color:#F4F3EE;">--fg</div>
      <div class="token-meta">#F4F3EE</div>
    </div>
  </div>
</div>
</body></html>
