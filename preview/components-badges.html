<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Badges</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-frame">
  <div class="tag" style="margin-bottom:14px;">Badges & pills</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
    <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 12px;border-radius:999px;background:#F4F3EE;color:#1A1A1A;border:1px solid #E8E6E0;">Active</span>
    <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 12px;border-radius:999px;background:transparent;color:#87A96B;border:1px solid #87A96B;"><span style="width:6px;height:6px;border-radius:999px;background:#87A96B;"></span>Live</span>
    <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 12px;border-radius:999px;background:#1A1A1A;color:#FAFAF7;">New</span>
    <span style="display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:transparent;color:#6B6B6B;border:1px solid #E8E6E0;">Beta</span>
    <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 12px;border-radius:999px;background:#FFF;color:#C97B5C;border:1px solid #E8E6E0;">3 errors</span>
  </div>
</div>
</body></html>
