<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-frame">
  <div class="tag" style="margin-bottom:14px;">Neutrals · Light</div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px;">
    <div class="col">
      <div class="swatch" style="background:#FAFAF7;"></div>
      <div class="token-name">--bg</div>
      <div class="token-meta">#FAFAF7</div>
    </div>
    <div class="col">
      <div class="swatch" style="background:#FFFFFF;"></div>
      <div class="token-name">--surface</div>
      <div class="token-meta">#FFFFFF</div>
    </div>
    <div class="col">
      <div class="swatch" style="background:#F4F3EE;"></div>
      <div class="token-name">--surface-elevated</div>
      <div class="token-meta">#F4F3EE</div>
    </div>
    <div class="col">
      <div class="swatch" style="background:#E8E6E0;"></div>
      <div class="token-name">--border</div>
      <div class="token-meta">#E8E6E0</div>
    </div>
    <div class="col">
      <div class="swatch" style="background:#9B9B9B;"></div>
      <div class="token-name">--fg-subtle</div>
      <div class="token-meta">#9B9B9B</div>
    </div>
    <div class="col">
      <div class="swatch" style="background:#6B6B6B;"></div>
      <div class="token-name">--fg-muted</div>
      <div class="token-meta">#6B6B6B</div>
    </div>
    <div class="col">
      <div class="swatch" style="background:#1A1A1A;"></div>
      <div class="token-name">--fg</div>
      <div class="token-meta">#1A1A1A</div>
    </div>
  </div>
</div>
</body></html>
