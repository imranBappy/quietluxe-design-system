<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-frame">
  <div class="tag" style="margin-bottom:14px;">Elevation · whisper only</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;">
    <div class="col" style="gap:10px;">
      <div style="height:74px;background:#FFFFFF;border:1px solid #E8E6E0;border-radius:12px;"></div>
      <div class="token-name">Hairline · border</div>
      <div class="token-meta">1px solid #E8E6E0</div>
    </div>
    <div class="col" style="gap:10px;">
      <div style="height:74px;background:#FFFFFF;border:1px solid #E8E6E0;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,0.04);"></div>
      <div class="token-name">Card · whisper</div>
      <div class="token-meta">0 1px 2px rgba(0,0,0,.04)</div>
    </div>
    <div class="col" style="gap:10px;">
      <div style="height:74px;background:#FFFFFF;border:1px solid #E8E6E0;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);"></div>
      <div class="token-name">Pop · menu/popover</div>
      <div class="token-meta">0 8px 24px rgba(0,0,0,.06)</div>
    </div>
  </div>
</div>
</body></html>
