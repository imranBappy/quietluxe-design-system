<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Radius</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-frame">
  <div class="tag" style="margin-bottom:14px;">Corner radii</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:18px;">
    <div class="col" style="align-items:center;gap:8px;">
      <div style="width:80px;height:60px;background:#F4F3EE;border:1px solid #E8E6E0;border-radius:4px;"></div>
      <div class="token-name">Input · 4</div>
    </div>
    <div class="col" style="align-items:center;gap:8px;">
      <div style="width:80px;height:60px;background:#F4F3EE;border:1px solid #E8E6E0;border-radius:8px;"></div>
      <div class="token-name">Button · 8</div>
    </div>
    <div class="col" style="align-items:center;gap:8px;">
      <div style="width:80px;height:60px;background:#F4F3EE;border:1px solid #E8E6E0;border-radius:12px;"></div>
      <div class="token-name">Card · 12</div>
    </div>
    <div class="col" style="align-items:center;gap:8px;">
      <div style="width:80px;height:32px;background:#F4F3EE;border:1px solid #E8E6E0;border-radius:999px;"></div>
      <div class="token-name">Pill · full</div>
    </div>
  </div>
</div>
</body></html>
