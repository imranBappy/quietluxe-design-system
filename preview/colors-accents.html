<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Accents</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card-frame">
  <div class="tag" style="margin-bottom:14px;">Accents · Rotate one per project</div>
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px;">
    <div class="col">
      <div class="swatch lg" style="background:#87A96B;"></div>
      <div class="token-name" style="font-family:var(--font-serif);font-size:14px;">Sage</div>
      <div class="token-meta">#87A96B</div>
    </div>
    <div class="col">
      <div class="swatch lg" style="background:#C97B5C;"></div>
      <div class="token-name" style="font-family:var(--font-serif);font-size:14px;">Terracotta</div>
      <div class="token-meta">#C97B5C</div>
    </div>
    <div class="col">
      <div class="swatch lg" style="background:#1E2A4A;"></div>
      <div class="token-name" style="font-family:var(--font-serif);font-size:14px;">Midnight</div>
      <div class="token-meta">#1E2A4A</div>
    </div>
    <div class="col">
      <div class="swatch lg" style="background:#D4AF7A;"></div>
      <div class="token-name" style="font-family:var(--font-serif);font-size:14px;">Champagne</div>
      <div class="token-meta">#D4AF7A</div>
    </div>
    <div class="col">
      <div class="swatch lg" style="background:#B5A8D4;"></div>
      <div class="token-name" style="font-family:var(--font-serif);font-size:14px;">Lavender Mist</div>
      <div class="token-meta">#B5A8D4</div>
    </div>
  </div>
</div>
</body></html>
